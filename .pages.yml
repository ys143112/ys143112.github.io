media:
  - name: images
    label: 이미지 보관함
    input: public/uploads
    output: /uploads
    rename: random
    extensions: [jpg, jpeg, png, webp, gif, avif]

content:
  - name: posts
    label: 게시글
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{fields.id}.md"
      field: false
    operations:
      rename: false
    view:
      fields: [title, date, category, published]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: id
        label: 글 고유 번호
        type: uuid
        options:
          editable: false
          generate: false
      - name: title
        label: 제목
        type: string
        required: true
      - name: date
        label: 작성일
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updated
        label: 수정일 (선택)
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: category
        label: 카테고리
        type: select
        required: true
        default: 개발 기록
        options:
          values: [3D 디자인, 개발 기록, AI 실험, 프로젝트]
      - name: published
        label: 블로그에 공개
        type: boolean
        default: false
        description: "켜고 저장하면 자동 게시됩니다. 공개 저장소에 저장한 원고는 이 설정과 관계없이 GitHub에서 보일 수 있습니다."
      - name: description
        label: 소개문 (선택)
        type: text
        description: "비워두면 본문에서 자동으로 추출합니다."
      - name: cover
        label: 대표 이미지 (선택)
        type: image
        options:
          media: images
      - name: coverAlt
        label: 대표 이미지 설명
        type: string
        description: "대표 이미지를 넣었다면 이미지에 무엇이 보이는지 설명해 주세요."
      - name: tags
        label: 태그 (선택)
        type: string
        list: true
      - name: featured
        label: 홈에 크게 소개
        type: boolean
        default: false
      - name: sample
        label: 샘플 글 표시
        type: boolean
        default: false
      - name: body
        label: 본문
        type: rich-text
        required: true
        options:
          format: markdown
          media: images
          switcher: true

  - name: site
    label: 블로그 소개 설정
    type: file
    path: src/data/site.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - { name: title, label: 블로그 이름, type: string, required: true }
      - { name: author, label: 작성자 표시 이름, type: string, required: true }
      - { name: description, label: 블로그 설명, type: text, required: true }
      - { name: intro, label: 홈 소개 문장, type: text, required: true }
      - { name: bio, label: 자기소개, type: text, required: true }
      - { name: url, label: 블로그 주소, type: string, required: true }
      - { name: github, label: GitHub 프로필 주소, type: string, required: true }
      - { name: repository, label: GitHub 저장소, type: string, required: true }
